name: Preview main, Janka and Darka

on:
  push:
    branches: [main, Janka, Darka]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Build separate branch previews with an in-memory KNX demo
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p site
          for branch in main Janka Darka; do
            git clone --quiet --depth 1 --branch "$branch" "https://github.com/$REPOSITORY.git" "$RUNNER_TEMP/preview-$branch"
            (
              cd "$RUNNER_TEMP/preview-$branch"
              npm ci --no-audit --no-fund
              SITE_BASE="/delitech-darek/$branch/" npm run build:preview
              npm ci --prefix planner --no-audit --no-fund
              VITE_KNX_DEMO=1 npm run build --prefix planner
              mkdir -p dist/projektant-knx
              cp -R planner/dist/. dist/projektant-knx/
              printf '{"branch":"%s","commit":"%s","demo":true}\n' "$branch" "$(git rev-parse HEAD)" > dist/release.json
            )
            cp -R "$RUNNER_TEMP/preview-$branch/dist" "site/$branch"
          done
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>InteliSpaces · podglądy</title><style>body{font:18px system-ui;max-width:800px;margin:10vh auto;padding:24px;background:#f3f7f8;color:#173744}a{display:inline-block;padding:18px;background:white;border:1px solid #ccdadd;border-radius:12px;margin:8px;color:#087b88}</style><h1>InteliSpaces · podglądy</h1><p>Każda gałąź ma własną wersję strony i konfigurator z przykładowym projektem.</p><a href="Janka/">Janka</a><a href="Darka/">Darka</a><a href="main/">main</a><p>Prawdziwe projekty zapisujemy na <a href="https://knx.intelispaces.pl/">knx.intelispaces.pl</a>.</p></html>
          HTML
          cp site/index.html site/404.html
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
