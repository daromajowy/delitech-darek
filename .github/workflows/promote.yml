name: Publikuj staging na produkcji

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Wklej wersję sprawdzoną na stagingu (12 znaków z paska Staging)'
        required: true
        type: string
      check_only:
        description: 'Tylko sprawdź gotowość, bez publikowania'
        type: boolean
        default: false

permissions:
  contents: read
  deployments: write

concurrency:
  group: cf-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Verify the selected staging version and both tested archives
        id: verify
        env:
          EXPECTED_COMMIT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-promotion.py
      - name: Request production deployment of this exact version
        if: ${{ !inputs.check_only }}
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api repos/daromajowy/delitech-darek/deployments --method POST --input build/promotion.json --jq .id)
          [[ "$id" =~ ^[0-9]+$ ]]
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/daromajowy/delitech-darek/deployments/$id/statuses" --method POST \
            -f state=in_progress -f environment_url=https://intelispaces.pl/ \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description='CF is promoting the exact tested website and KNX packages' >/dev/null
      - name: Confirm production website and KNX
        if: ${{ !inputs.check_only }}
        env:
          RELEASE_COMMIT: ${{ steps.verify.outputs.commit }}
          RELEASE_ENV: production
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
        run: python3 scripts/wait-for-cf.py
      - name: Record deployment result
        if: ${{ always() && steps.deploy.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.id }}
          RESULT: ${{ job.status }}
        run: |
          state=error
          if [ "$RESULT" = success ]; then state=success; fi
          gh api "repos/daromajowy/delitech-darek/deployments/$DEPLOYMENT_ID/statuses" --method POST \
            -f state="$state" -f environment_url=https://intelispaces.pl/ \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Show the selected version
        if: success()
        env:
          COMMIT: ${{ steps.verify.outputs.commit }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          printf 'Wersja: `%s`\n\nTryb tylko sprawdzenie: %s\n\n[Staging](https://staging.intelispaces.pl/) · [Produkcja](https://intelispaces.pl/)\n\nPublikacja przenosi kod. Baza, konta i dokumenty produkcyjne pozostają na CF.\n' "$COMMIT" "$CHECK_ONLY" >> "$GITHUB_STEP_SUMMARY"
