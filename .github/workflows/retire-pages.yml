name: Retire legacy GitHub Pages previews

on:
  push:
    branches: [Janka]
    paths: [.github/workflows/retire-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://intelispaces.pl/
    steps:
      - name: Confirm the new public site is available
        run: |
          curl --fail --silent --show-error --location https://intelispaces.pl/ -o /tmp/site.html
          grep -q '__INTELISPACES__' /tmp/site.html
      - name: Replace every old preview with a redirect
        run: |
          mkdir -p site/Janka site/Darka site/janka site/darka
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="canonical" href="https://intelispaces.pl/"><meta http-equiv="refresh" content="0;url=https://intelispaces.pl/"><title>InteliSpaces — nowy adres strony</title></head><body><p>Stare podglądy zostały wyłączone. <a href="https://intelispaces.pl/">Przejdź do aktualnej strony InteliSpaces</a>.</p></body></html>
          HTML
          cp site/index.html site/404.html
          for branch in Janka Darka janka darka; do cp site/index.html "site/$branch/index.html"; done
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Publish redirects without any legacy application assets
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
