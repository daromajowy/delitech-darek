name: Deploy Delitech to GitHub Pages

on:
  push:
    branches: ['main', 'Darka', 'Janka']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
					 
          fetch-depth: 0

      - name: Fetch all remote branches
        run: |
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. ZBUDUJ STRONĘ GŁÓWNĄ (main) w katalogu głównym ./site
      - name: Build main (production)
        run: |
          echo "=== Building main branch ==="
          git checkout main
          npm install --legacy-peer-deps
          npm run build
          mkdir -p ./site
          cp -r dist/* ./site/

      # 2. ZBUDUJ PODGLĄD DARKA W ODRĘBNYM KATALOGU
      - name: Build Darka preview
        run: |
          echo "=== Checking and building Darka branch ==="
          if git show-ref --verify --quiet refs/remotes/origin/Darka; then
            mkdir -p /tmp/branch-darka
            git archive origin/Darka | tar -x -C /tmp/branch-darka
            cd /tmp/branch-darka
            npm install --legacy-peer-deps
            npm run build
            sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' dist/index.html
            mkdir -p "$GITHUB_WORKSPACE/site/Darka"
            cp -r dist/* "$GITHUB_WORKSPACE/site/Darka/"
            echo "DARKA_BUILT=true" >> "$GITHUB_ENV"
            echo "Darka preview built successfully!"
          else
            echo "Branch Darka not found, skipping"
          fi

      # 3. ZBUDUJ PODGLĄD JANKA W ODRĘBNYM KATALOGU
      - name: Build Janka preview
        run: |
          echo "=== Checking and building Janka branch ==="
          if git show-ref --verify --quiet refs/remotes/origin/Janka; then
            mkdir -p /tmp/branch-janka
            git archive origin/Janka | tar -x -C /tmp/branch-janka
            cd /tmp/branch-janka
            npm install --legacy-peer-deps
            npm run build
            sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' dist/index.html
            mkdir -p "$GITHUB_WORKSPACE/site/Janka"
            cp -r dist/* "$GITHUB_WORKSPACE/site/Janka/"
            echo "JANKA_BUILT=true" >> "$GITHUB_ENV"
            echo "Janka preview built successfully!"
          else
            echo "Branch Janka not found, skipping"
          fi

      # 4. WDROŻENIE NA GITHUB PAGES
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Podsumowanie linkow
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### 🚀 Opublikowane wersje:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Wersja Główna (main):** $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$DARKA_BUILT" = "true" ]; then
            echo "- **Podgląd Darka (Darka):** ${PAGE_URL}Darka/" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$JANKA_BUILT" = "true" ]; then
            echo "- **Podgląd Janka (Janka):** ${PAGE_URL}Janka/" >> "$GITHUB_STEP_SUMMARY"
          fi
