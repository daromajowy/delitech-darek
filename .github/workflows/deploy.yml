name: Deploy Delitech to GitHub Pages

on:
  push:
    branches:
      - main
      - Darka
      - Janka
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches
        shell: bash
        run: |
          git fetch --no-tags --prune origin "+refs/heads/*:refs/remotes/origin/*"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build main site
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Building main branch ==="
          git checkout -B main origin/main
          npm install --legacy-peer-deps
          npm run build

          mkdir -p "$GITHUB_WORKSPACE/site"
          cp -r dist/* "$GITHUB_WORKSPACE/site/"

      - name: Build Darka preview
        shell: bash
        env:
          SITE_DIR: ${{ github.workspace }}/site
        run: |
          set -euo pipefail

          echo "=== Checking and building Darka branch ==="
          if git show-ref --verify --quiet refs/remotes/origin/Darka; then
            rm -rf /tmp/branch-darka
            mkdir -p /tmp/branch-darka
            git archive origin/Darka | tar -x -C /tmp/branch-darka

            cd /tmp/branch-darka
            npm install --legacy-peer-deps
            npm run build

            if [ -f dist/index.html ]; then
              sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' dist/index.html
            fi

            mkdir -p "$SITE_DIR/Darka"
            cp -r dist/* "$SITE_DIR/Darka/"
            echo "DARKA_BUILT=true" >> "$GITHUB_ENV"
            echo "Darka preview built successfully!"
          else
            echo "Branch Darka not found, skipping"
          fi

      - name: Build Janka preview
        shell: bash
        env:
          SITE_DIR: ${{ github.workspace }}/site
        run: |
          set -euo pipefail

          echo "=== Checking and building Janka branch ==="
          if git show-ref --verify --quiet refs/remotes/origin/Janka; then
            rm -rf /tmp/branch-janka
            mkdir -p /tmp/branch-janka
            git archive origin/Janka | tar -x -C /tmp/branch-janka

            cd /tmp/branch-janka
            npm install --legacy-peer-deps
            npm run build

            if [ -f dist/index.html ]; then
              sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' dist/index.html
            fi

            mkdir -p "$SITE_DIR/Janka"
            cp -r dist/* "$SITE_DIR/Janka/"
            echo "JANKA_BUILT=true" >> "$GITHUB_ENV"
            echo "Janka preview built successfully!"
          else
            echo "Branch Janka not found, skipping"
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write deployment summary
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "### 🚀 Opublikowane wersje:" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Wersja Główna (main):** ${PAGE_URL}" >> "$GITHUB_STEP_SUMMARY"

          if [ "${DARKA_BUILT:-}" = "true" ]; then
            echo "- **Podgląd Darka (Darka):** ${PAGE_URL}Darka/" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${JANKA_BUILT:-}" = "true" ]; then
            echo "- **Podgląd Janka (Janka):** ${PAGE_URL}Janka/" >> "$GITHUB_STEP_SUMMARY"
          fi
